name: Build and Release

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code and bundled injector dependency
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore projects
        shell: pwsh
        run: |
          dotnet restore "r.e.p.o cheat.sln"
          dotnet restore "external/SharpMonoInjector/src/SharpMonoInjector/SharpMonoInjector.csproj"
          dotnet restore "RepoInjector/RepoInjector.csproj"

      - name: Build payload DLL
        run: dotnet build "r.e.p.o cheat.sln" -c Release --no-restore --nologo

      - name: Run tests
        run: dotnet test "r.e.p.o cheat.Tests/r.e.p.o cheat.Tests.csproj" -c Release --no-restore --nologo

      - name: Publish elevated one-file injector
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "release-artifacts"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          dotnet publish "RepoInjector/RepoInjector.csproj" -c Release --no-restore --nologo -o $releaseDirectory
          $launcher = Join-Path $releaseDirectory "DarkMenu.Injector.exe"
          if (-not (Test-Path -LiteralPath $launcher)) {
            throw "Expected release launcher was not produced: $launcher"
          }
          $hash = (Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DarkMenu.Injector.exe" | Set-Content -LiteralPath "$launcher.sha256" -NoNewline

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ### Windows launcher

            1. Start R.E.P.O. normally.
            2. Run `DarkMenu.Injector.exe`.
            3. Approve the Windows UAC prompt.

            The launcher targets only `repo.exe`, contains the payload DLL internally, and writes diagnostics to `%LOCALAPPDATA%\DarkMenu\injector.log`.
          files: |
            release-artifacts/DarkMenu.Injector.exe
            release-artifacts/DarkMenu.Injector.exe.sha256
          draft: false
          prerelease: false
